plugins {
    id 'com.android.application'
}

android {
    namespace 'org.thermocell.vision'
    compileSdk 34

    defaultConfig {
        applicationId "org.thermocell.vision"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1.0"

        // Read from local.properties (gitignored) so the key is never
        // committed. See README for setup: groq.apiKey=gsk_xxx
        def groqApiKey = ""
        if (groqApiKey.isEmpty()) { groqApiKey = System.getenv('GROQ_API_KEY') ?: '' }
        Properties localProps = new Properties()
        File localPropsFile = rootProject.file("local.properties")
        if (localPropsFile.exists()) {
            localProps.load(new FileInputStream(localPropsFile))
            groqApiKey = localProps.getProperty("groq.apiKey", "")
        }
        buildConfigField "String", "GROQ_API_KEY", "\"${groqApiKey}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // -- Camera (CameraX): replaces camera4kivy/CameraX-via-p4a-hook -----
    def camerax_version = "1.3.4"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    // -- Computer vision (replaces the Python opencv-python pipeline) ----
    // Published directly to Maven Central since OpenCV 4.9.0 - no manual
    // native .aar wrangling needed.
    implementation "org.opencv:opencv:4.9.0"

    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.core:core:1.13.1"

    // -- Groq vision API client (plain HTTP, no extra SDK needed) --------
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
}
